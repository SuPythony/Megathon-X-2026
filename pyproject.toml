[project]
name = "greentwin"
version = "0.1.0"
description = "GreenTwin: Green Home Score, physics digital twin and retrofit recommendation engine (Megathon X, Lloyds PS2)"
readme = "README.md"
requires-python = ">=3.11,<3.13"   # pinned: torch/jax/interpret wheels; do NOT use the machine's 3.14
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=15",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "xgboost>=2.0",
  "interpret>=0.6",          # EBM
  "shap>=0.45",
  "mapie>=0.8",              # conformal intervals
  "torch>=2.3",
  "torchdiffeq>=0.2",
  "torch-geometric>=2.5",    # GraphSAGE GNN on the LSOA graph (B8)
  "numpyro>=0.15",
  "jax>=0.4.28",
  "arviz>=0.18",
  "pymoo>=0.6",
  "econml>=0.15",
  "dowhy>=0.11",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pysal>=24.1",
  "requests>=2.31",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "anthropic>=0.40",
  "openai>=3.28",            # P4 LLM provider (Responses API)
  "reportlab>=4.0",
  "pytest>=8.0",
  "ruff>=0.5",
  "odfpy>=1.4.1",
]

[project.optional-dependencies]
stretch = [
  "gpytorch>=1.11",
  "botorch>=0.11",
  "neuraloperator>=0.3",
  "deepxde>=1.11",
  "causalml>=0.15",
  "qdrant-client>=1.9",
  "kuzu>=0.4",
  "diffrax>=0.6",            # ODE solver for the Option-B JAX twin
]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
